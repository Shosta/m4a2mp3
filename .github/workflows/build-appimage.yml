name: Build AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller PyQt6

      - name: Build standalone application
        run: >-
          pyinstaller --noconfirm --clean --windowed
          --name M4A2MP3
          --exclude-module PyQt5
          --distpath dist
          --workpath build
          gui_qt.py

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/128x128/apps
          cp -a dist/M4A2MP3/. AppDir/usr/bin/
          install -m 755 AppRun AppDir/AppRun
          install -m 644 m4a2mp3.desktop AppDir/m4a2mp3.desktop
          install -m 644 m4a2mp3.desktop AppDir/usr/share/applications/m4a2mp3.desktop
          install -m 644 m4a2mp3.svg AppDir/m4a2mp3.svg
          install -m 644 m4a2mp3.svg AppDir/usr/share/icons/hicolor/128x128/apps/m4a2mp3.svg

      - name: Build AppImage
        run: |
          curl -L --fail --output appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract-and-run AppDir M4A2MP3-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: M4A2MP3-x86_64-AppImage
          path: M4A2MP3-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

name: Build AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller PyQt6

      - name: Build standalone application
        run: >-
          pyinstaller --noconfirm --clean --windowed
          --name M4A2MP3
          --exclude-module PyQt5
          --distpath dist
          --workpath build
          --hidden-import ui
          --hidden-import ui.qt_compat
          --hidden-import ui.drop_tree
          --hidden-import ui.options
          --hidden-import ui.artwork
          --hidden-import ui.source_tree
          --hidden-import ui.result_tree
          --add-data m4a2mp3.png:.
          gui_qt.py

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          cp -a dist/M4A2MP3/. AppDir/usr/bin/
          install -m 755 AppRun AppDir/AppRun
          install -m 644 m4a2mp3.desktop AppDir/m4a2mp3.desktop
          install -m 644 m4a2mp3.desktop AppDir/usr/share/applications/m4a2mp3.desktop
          install -m 644 m4a2mp3.png AppDir/m4a2mp3.png
          install -m 644 m4a2mp3.png AppDir/usr/share/icons/hicolor/512x512/apps/m4a2mp3.png

      - name: Build AppImage
        run: |
          curl -L --fail --output appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract-and-run AppDir M4A2MP3-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v6
        with:
          name: M4A2MP3-x86_64-AppImage
          path: M4A2MP3-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Publish AppImage to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: M4A2MP3-x86_64.AppImage
          fail_on_unmatched_files: true
